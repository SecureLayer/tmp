name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e
          missing=0
          for sha in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            msg=$(git log -1 --format=%B "$sha")
            if ! echo "$msg" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha is missing a 'Signed-off-by' trailer (DCO)."
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Every commit must include a 'Signed-off-by' line certifying you have the right to submit this contribution (see CONTRIBUTING.md)."
            echo "Add it with 'git commit -s', or amend existing commits with 'git commit --amend -s'."
            exit 1
          fi
          echo "All commits have a valid DCO sign-off."
