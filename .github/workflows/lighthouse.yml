name: Lighthouse CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit live site
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          urls: |
            https://securelayer.co/
            https://securelayer.co/blog
            https://securelayer.co/free-cybersecurity-ai-prompts
            https://securelayer.co/github-security-assessment
            https://securelayer.co/security
            https://securelayer.co/sustainability
          configPath: ./.lighthouserc.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
